<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
  <defs>
    <!-- Background Neutral Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3EC"/>
      <stop offset="50%" stop-color="#EBE7DC"/>
      <stop offset="100%" stop-color="#DFD9CB"/>
    </linearGradient>
    
    <!-- Subtle Silhouette Gradient -->
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243D2F"/>
      <stop offset="100%" stop-color="#14261D"/>
    </linearGradient>

    <!-- Lime Accent Glow -->
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#98D437"/>
      <stop offset="100%" stop-color="#7DBA26"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="640" fill="url(#bgGrad)"/>
  
  <!-- Subtle Architectural Grid Line -->
  <line x1="40" y1="40" x2="440" y2="40" stroke="#D3CCA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="560" x2="440" y2="560" stroke="#D3CCA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="40" x2="40" y2="560" stroke="#D3CCA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="440" y1="40" x2="440" y2="560" stroke="#D3CCA" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Halo Circle Behind Head -->
  <circle cx="240" cy="220" r="110" fill="#E2DDCE" opacity="0.6"/>

  <!-- Doctor Silhouette: Head & Neck -->
  <circle cx="240" cy="195" r="54" fill="url(#silhouetteGrad)"/>
  
  <!-- Neck -->
  <path d="M224 240 L256 240 L260 270 L220 270 Z" fill="url(#silhouetteGrad)"/>

  <!-- Torso & Doctor Coat Silhouette -->
  <path d="M120 460 C120 330 170 280 216 268 L240 330 L264 268 C310 280 360 330 360 460 L360 520 L120 520 Z" fill="url(#silhouetteGrad)"/>
  
  <!-- Doctor Coat Collar / Lapels (Stylized Botanical Elegance) -->
  <path d="M216 268 L240 370 L190 460" stroke="#F5F3EC" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M264 268 L240 370 L290 460" stroke="#F5F3EC" stroke-width="3" fill="none" opacity="0.6"/>
  <line x1="240" y1="370" x2="240" y2="520" stroke="#F5F3EC" stroke-width="2" opacity="0.4"/>

  <!-- Inner Monogram Circle -->
  <circle cx="240" cy="195" r="38" fill="none" stroke="#98D437" stroke-width="1.5" opacity="0.8"/>
  <text x="240" y="204" font-family="'Fraunces', serif" font-size="24" font-weight="600" fill="#F8F6F0" text-anchor="middle" letter-spacing="1">SL</text>

  <!-- Lime Botanical Dot Accent -->
  <circle cx="240" cy="285" r="4" fill="#98D437"/>

  <!-- Card Frame Overlay Info -->
  <rect x="56" y="475" width="368" height="65" rx="3" fill="#12281D" opacity="0.94"/>
  <rect x="56" y="475" width="368" height="3" fill="url(#limeGlow)"/>

  <text x="240" y="502" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#98D437" text-anchor="middle" letter-spacing="2">TEMPORARY REFERENCE PROFILE</text>
  <text x="240" y="524" font-family="'Fraunces', serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Dr. Sudhir Lohia · Bengaluru Branch</text>
</svg>
